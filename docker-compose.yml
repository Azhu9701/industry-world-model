name: industry-world-model

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industry_world_model}
      POSTGRES_USER: ${POSTGRES_USER:-iwm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iwm_local_only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: postgres:18-alpine
    working_dir: /workspace
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://iwm:iwm_local_only@db:5432/industry_world_model}
    volumes:
      - .:/workspace:ro
    command: ["./scripts/migrate", "--inside"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://iwm:iwm_local_only@db:5432/industry_world_model}
      API_PORT: 8080
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  agent:
    build: ./apps/agent
    environment:
      AGENT_PORT: 8090
      DEFAULT_PACK: ${DEFAULT_PACK:-example}
      PACKS_DIR: /workspace/packs
      SKILLS_DIR: /workspace/skills
    ports:
      - "${AGENT_PORT:-8090}:8090"
    volumes:
      - ./packs:/workspace/packs:ro
      - ./skills:/workspace/skills:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./apps/web
    environment:
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
